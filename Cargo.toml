[package]
name = "overpass-cli"
version = "0.2.1"
description = "Query OpenStreetMap data using the Overpass API"
authors = ["Jake Low <hello@jakelow.com>"]
homepage = "https://github.com/jake-low/overpass-cli"
repository = "https://github.com/jake-low/overpass-cli"
license = "ISC"
edition = "2021"

[dependencies]
byte-unit = { version = "5.1.6", features = ["serde"] }
clap = { version = "4.5.17", features = ["derive", "cargo"] }
jsonxf = "1.1.1"
serde_json = "1.0.138"
ureq = "2.10.1"
urlencoding = "2.1.3"

[[bin]]
name = "overpass"
path = "src/main.rs"
